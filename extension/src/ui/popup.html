<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XInput Bridge</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { width: 340px; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    section { padding: 12px 16px; border-top: 1px solid var(--line); }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
    .row + .row { border-top: 1px solid #1f2328; }
    .row .main { flex: 1; min-width: 0; }
    .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .sub { font-size: 12px; color: var(--muted); }
    .row .err { font-size: 12px; color: var(--error); margin-top: 2px; }
    .player { font-variant-numeric: tabular-nums; font-weight: 600; width: 22px; color: var(--muted); }
    .dot.live { background: #8ff0b5; box-shadow: 0 0 0 3px #1f4a30; }
    .empty { color: var(--muted); padding: 4px 0 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn.primary { flex: 1; }
    .site { display: flex; align-items: center; gap: 12px; }
    .site .main { flex: 1; min-width: 0; }
    .site .host { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .problem { color: var(--error); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <img src="../../icons/icon-48.png" alt="">
    <h1>XInput Bridge</h1>
    <span id="count" class="chip">No controllers</span>
  </header>

  <section>
    <div id="list"></div>
    <p id="nousb" class="problem" hidden>This browser has no WebUSB support, so the bridge can't run. Use Google Chrome 118 or newer.</p>
    <div class="actions">
      <button id="pair" class="btn primary">Pair a controller</button>
      <button id="dashboard" class="btn">Dashboard</button>
    </div>
    <p id="pair-error" class="problem" hidden></p>
  </section>

  <section id="site-section" hidden>
    <div class="site">
      <div class="main">
        <div class="label" style="margin:0">This site</div>
        <div id="host" class="host"></div>
      </div>
      <label class="switch" title="Use bridged controllers on this site">
        <input id="site-toggle" type="checkbox" aria-label="Use bridged controllers on this site">
        <span></span>
      </label>
    </div>
    <div id="reload-box" hidden>
      <p class="note">Reload this tab to use your controller here. Tabs opened before the extension was installed or updated don't have it yet.</p>
      <div class="actions"><button id="reload" class="btn small">Reload tab</button></div>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
