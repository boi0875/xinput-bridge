<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XInput Bridge</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body { width: 340px; }
    header { display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px; }
    header img { width: 20px; height: 20px; }
    header h1 { font-size: 15px; font-weight: 500; flex: 1; }
    section { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    .row .main { flex: 1; min-width: 0; }
    .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .sub { font-size: 12px; line-height: 16px; color: var(--muted); }
    .row .err { font-size: 12px; line-height: 16px; color: var(--error); margin-top: 2px; }
    .row .lead { width: 24px; flex: none; display: flex; justify-content: center; }
    .player { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    /* Lights up briefly on input, like the pad's own LED. */
    .row .dot { transition: transform 120ms var(--ease), background-color 120ms var(--ease); }
    .row .dot.live { transform: scale(1.5); background: var(--accent-hover); }
    .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions .btn { height: 36px; }
    .actions .btn.primary { flex: 1; }
    .site { display: flex; align-items: center; gap: 12px; }
    .site .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .site .label { font-size: 12px; line-height: 16px; color: var(--muted); }
    .site .host { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .problem { color: var(--error); font-size: 13px; margin-top: 12px; }
    #reload-box .actions { margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <img src="../../icons/icon-48.png" alt="">
    <h1>XInput Bridge</h1>
    <span id="count" class="status"><span class="dot"></span><span id="count-text">No controllers</span></span>
  </header>

  <section>
    <div id="list"></div>
    <p id="nousb" class="problem" hidden>This browser has no WebUSB support, so the bridge can't run. Use Google Chrome 118 or newer.</p>
    <div class="actions">
      <button id="pair" class="btn primary">Pair a controller</button>
      <button id="dashboard" class="btn">Dashboard</button>
    </div>
    <p id="pair-error" class="problem" hidden></p>
  </section>

  <section id="site-section" hidden>
    <div class="site">
      <div class="main">
        <div class="label">This site</div>
        <div id="host" class="host"></div>
      </div>
      <label class="switch" title="Use bridged controllers on this site">
        <input id="site-toggle" type="checkbox" aria-label="Use bridged controllers on this site">
        <span></span>
      </label>
    </div>
    <div id="reload-box" hidden>
      <p class="note">Reload this tab to use your controller here. Tabs opened before the extension was installed or updated don't have it yet.</p>
      <div class="actions"><button id="reload" class="btn small">Reload tab</button></div>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
