name: Controller report
description: A controller works, doesn't work, or works partly
labels: [controller]
body:
  - type: input
    id: controller
    attributes:
      label: Controller
      description: Brand and model, and how it connects (cable, 2.4 GHz dongle, wireless receiver).
      placeholder: PowerA OPS v3 Pro, 2.4 GHz dongle
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: USB ids and protocol
      description: Shown under the controller's name on the dashboard.
      placeholder: 20d6:2035 · Xbox 360 (XInput)
  - type: dropdown
    id: result
    attributes:
      label: What happens
      options:
        - Works fully
        - Works, with problems (describe below)
        - Not in Chrome's device list
        - Pairs, but shows an error on the dashboard
        - Pairs, but no input reaches the dashboard or the game
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which site or game, what you expected, what you saw. Include any error text from the dashboard.
  - type: textarea
    id: raw
    attributes:
      label: Raw USB capture
      description: Dashboard → Raw USB reports → Start capture, press each button once, then Copy and paste here.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Extension, Chrome and macOS versions.
      placeholder: XInput Bridge 2.0.0, Chrome 142, macOS 26.1
